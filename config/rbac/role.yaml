---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - daemonsets/status
  - deployments/status
  - statefulsets/status
  verbs:
  - get
- apiGroups:
  - control.vitastor.io
  resources:
  - vitastorclusters
  - vitastornodes
  - vitastorosds
  - vitastorpools
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - control.vitastor.io
  resources:
  - vitastorclusters/finalizers
  - vitastornodes/finalizers
  - vitastorosds/finalizers
  - vitastorpools/finalizers
  verbs:
  - update
- apiGroups:
  - control.vitastor.io
  resources:
  - vitastorclusters/status
  - vitastornodes/status
  - vitastorosds/status
  - vitastorpools/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - v1
  resources:
  - configmaps
  verbs:
  - get
  - list
- apiGroups:
  - v1
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
